server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'nonce-elevenlabs-convai-widget' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://storage.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ${CSP_CONNECT_SRC} https://api.elevenlabs.io https://api.us.elevenlabs.io https://api.eu.residency.elevenlabs.io https://api.in.residency.elevenlabs.io wss://api.elevenlabs.io wss://api.us.elevenlabs.io wss://api.eu.residency.elevenlabs.io wss://api.in.residency.elevenlabs.io; frame-src 'self' ${CSP_FRAME_SRC}; child-src 'self' ${CSP_FRAME_SRC}; frame-ancestors 'none'; form-action 'self'; media-src 'self' blob: https://cxm.nyc3.digitaloceanspaces.com https://cxm-bpd.s3.us-east-1.amazonaws.com; manifest-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), fullscreen=()" always;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location / {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'nonce-elevenlabs-convai-widget' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://storage.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ${CSP_CONNECT_SRC} https://api.elevenlabs.io https://api.us.elevenlabs.io https://api.eu.residency.elevenlabs.io https://api.in.residency.elevenlabs.io wss://api.elevenlabs.io wss://api.us.elevenlabs.io wss://api.eu.residency.elevenlabs.io wss://api.in.residency.elevenlabs.io; frame-src 'self' ${CSP_FRAME_SRC}; child-src 'self' ${CSP_FRAME_SRC}; frame-ancestors 'none'; form-action 'self'; media-src 'self' blob: https://cxm.nyc3.digitaloceanspaces.com https://cxm-bpd.s3.us-east-1.amazonaws.com; manifest-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), fullscreen=()" always;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    access_log off;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'nonce-elevenlabs-convai-widget' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://storage.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ${CSP_CONNECT_SRC} https://api.elevenlabs.io https://api.us.elevenlabs.io https://api.eu.residency.elevenlabs.io https://api.in.residency.elevenlabs.io wss://api.elevenlabs.io wss://api.us.elevenlabs.io wss://api.eu.residency.elevenlabs.io wss://api.in.residency.elevenlabs.io; frame-src 'self' ${CSP_FRAME_SRC}; child-src 'self' ${CSP_FRAME_SRC}; frame-ancestors 'none'; form-action 'self'; media-src 'self' blob: https://cxm.nyc3.digitaloceanspaces.com https://cxm-bpd.s3.us-east-1.amazonaws.com; manifest-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), fullscreen=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
